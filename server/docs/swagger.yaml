openapi: 3.0.0
info:
  title: Portfolio API
  version: 1.0.0
  description: API pour gérer les skills, catégories et projets du portfolio

servers:
  - url: http://localhost:4000/api
    description: Serveur local

tags:
  - name: Auth
    description: Authentification des utilisateurs
  - name: Skills
    description: Gestion des compétences
  - name: Categories
    description: Gestion des catégories
  - name: Projects
    description: Gestion des projets

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Skill:
      type: object
      properties:
        _id:
          type: string
          description: Identifiant unique du skill
          example: "64f1a2b3c4d5e6f7a8b9c0d1"
        name:
          type: string
          description: Nom du skill
          example: "JavaScript"
        logoUrl:
          type: string
          description: URL du logo SVG
          example: "https://mon-site.com/images/js.svg"
        category:
          type: string
          description: ID de la catégorie associée
          example: "64f1a2b3c4d5e6f7a8b9c0d2"
        owner:
          type: string
          description: ID de l'utilisateur propriétaire
          example: "64f1a2b3c4d5e6f7a8b9c0d3"
        createdAt:
          type: string
          format: date-time
          description: Date de création
          example: "2025-11-19T09:46:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Date de mise à jour
          example: "2025-11-19T09:46:00.000Z"

    Category:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        _id:
          type: string
          description: Identifiant unique du projet
          example: "64f1a2b3c4d5e6f7a8b9c0d1"
        title:
          type: string
          description: Titre du projet
          example: "Portfolio Jocelyn"
        description:
          type: array
          description: Liste des paragraphes de description
          items:
            type: string
          example: ["Projet fullstack", "Développé avec React et Node.js"]
        imageCover:
          type: string
          description: URL de l'image principale
          example: "https://mon-site.com/images/cover.png"
        carouselImages:
          type: array
          description: Liste des images supplémentaires
          items:
            type: string
          example:
            [
              "https://mon-site.com/images/img1.png",
              "https://mon-site.com/images/img2.png",
            ]
        techLogos:
          type: array
          description: Logos des technologies utilisées
          items:
            type: string
          example:
            [
              "https://mon-site.com/images/react.svg",
              "https://mon-site.com/images/node.svg",
            ]
        tags:
          type: array
          description: Liste des tags associés au projet
          items:
            type: string
          example: ["React", "Node.js", "MongoDB"]
        githubLink:
          type: string
          description: Lien vers le dépôt GitHub
          example: "https://github.com/jocelyn/portfolio"
        demoLink:
          type: string
          description: Lien vers la démo en ligne
          example: "https://portfolio-jocelyn.vercel.app"
        owner:
          type: string
          description: ID de l'utilisateur propriétaire
          example: "64f1a2b3c4d5e6f7a8b9c0d2"
        createdAt:
          type: string
          format: date-time
          description: Date de création
          example: "2025-11-19T09:46:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Date de mise à jour
          example: "2025-11-19T09:46:00.000Z"

paths:
  /auth/login:
    post:
      summary: Connecte un utilisateur existant
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        "200":
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    description: ID MongoDB de l'utilisateur
                    example: 64f1a2b3c4d5e6f7a8b9c0d1
                  token:
                    type: string
                    description: JWT généré pour l'utilisateur
        "401":
          description: Identifiants invalides
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Incorrect username or password.
        "500":
          description: Erreur serveur lors de la connexion
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Login failed
                  details:
                    type: string
                    example: "Database connection error"

  /skills:
    get:
      summary: Récupère tous les skills
      tags: [Skills]
      responses:
        "200":
          description: Liste des skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
        "500":
          description: Erreur serveur lors de la récupération
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error fetching skills"
                  details:
                    type: string
                    example: "Database connection failed"

    post:
      summary: Crée un nouveau skill
      tags: [Skills]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                logo:
                  type: string
                  format: binary
                  description: Fichier SVG du logo
      responses:
        "201":
          description: Skill créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Skill created"
                  skill:
                    $ref: "#/components/schemas/Skill"
        "400":
          description: Fichier SVG requis
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Fichier SVG requis"
        "500":
          description: Erreur serveur lors de la création
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error creating skill"
                  details:
                    type: string
                    example: "Validation error"

  /skills/{id}:
    put:
      summary: Met à jour un skill
      tags: [Skills]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                logo:
                  type: string
                  format: binary
                  description: Nouveau fichier SVG
      responses:
        "200":
          description: Skill mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Skill updated"
                  skill:
                    $ref: "#/components/schemas/Skill"
        "404":
          description: Skill non trouvé
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Skill not found"
        "500":
          description: Erreur serveur lors de la mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error updating skill"
                  details:
                    type: string
                    example: "Database error"

    delete:
      summary: Supprime un skill
      tags: [Skills]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Skill supprimé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Skill deleted"
        "404":
          description: Skill non trouvé
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Skill not found"
        "500":
          description: Erreur serveur lors de la suppression
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error deleting skill"
                  details:
                    type: string
                    example: "Database error"

  /categories:
    get:
      summary: Récupère toutes les catégories
      tags: [Categories]
      responses:
        "200":
          description: Liste des catégories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "500":
          description: Erreur serveur lors de la récupération
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error fetching categories"
                  details:
                    type: string
                    example: "Database connection failed"

    post:
      summary: Crée une nouvelle catégorie
      tags: [Categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        "201":
          description: Catégorie créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Category created"
                  category:
                    $ref: "#/components/schemas/Category"
        "500":
          description: Erreur serveur lors de la création
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error creating category"
                  details:
                    type: string
                    example: "Validation error"

  /categories/{id}:
    put:
      summary: Met à jour une catégorie
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        "200":
          description: Catégorie mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Category updated"
                  category:
                    $ref: "#/components/schemas/Category"
        "404":
          description: Catégorie non trouvée
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Category not found"
        "500":
          description: Erreur serveur lors de la mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error updating category"
                  details:
                    type: string
                    example: "Database error"

    delete:
      summary: Supprime une catégorie
      tags: [Categories]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catégorie supprimée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Category deleted"
        "404":
          description: Catégorie non trouvée
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Category not found"
        "500":
          description: Erreur serveur lors de la suppression
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error deleting category"
                  details:
                    type: string
                    example: "Database error"

  /projects:
    get:
      summary: Récupère tous les projets
      tags: [Projects]
      responses:
        "200":
          description: Liste des projets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "500":
          description: Erreur serveur lors de la récupération
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error while retrieving projects"

    post:
      summary: Crée un nouveau projet
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - imageCover
              properties:
                title:
                  type: string
                description:
                  type: string
                imageCover:
                  type: string
                  format: binary
                  description: Image principale du projet
                carouselImages:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Images supplémentaires
                tags:
                  type: string
                githubLink:
                  type: string
                demoLink:
                  type: string
      responses:
        "201":
          description: Projet créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Project successfully created"
                  project:
                    $ref: "#/components/schemas/Project"
        "400":
          description: Image principale manquante
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Main image is required in request payload"
        "500":
          description: Erreur serveur lors de la création
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error while creating project"
                  details:
                    type: string
                    example: "Validation error"

  /projects/{id}:
    get:
      summary: Récupère un projet par ID
      tags: [Projects]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Projet trouvé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Projet non trouvé
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Project not found in database"
        "500":
          description: Erreur serveur lors de la récupération
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error while retrieving projects"

    put:
      summary: Met à jour un projet
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                imageCover:
                  type: string
                  format: binary
                carouselImages:
                  type: array
                  items:
                    type: string
                    format: binary
                tags:
                  type: string
                githubLink:
                  type: string
                demoLink:
                  type: string
      responses:
        "200":
          description: Projet mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Project updated"
                  project:
                    $ref: "#/components/schemas/Project"
        "404":
          description: Projet non trouvé
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Project not found"
        "500":
          description: Erreur serveur lors de la mise à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error updating project"
                  details:
                    type: string
                    example: "Database error"

    delete:
      summary: Supprime un projet
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Projet supprimé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Project deleted"
        "404":
          description: Projet non trouvé
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Project not found"
        "500":
          description: Erreur serveur lors de la suppression
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error deleting project"
                  details:
                    type: string
                    example:

  /send-mail:
    post:
      summary: Envoi d'un mail depuis le formulaire de contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                message:
                  type: string
              required:
                - name
                - email
                - message
      responses:
        "200":
          description: Email envoyé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "500":
          description: Erreur serveur
